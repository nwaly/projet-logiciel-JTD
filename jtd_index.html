<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Application Name</title>
  <link rel="stylesheet" href="jtd_style.css">
  <style></style>
</head>
<body>
  <table id="bar" class="topbar">
    <th>
      <h3 id="today" class="left" style="color: white;"></h3>
    </th>
    <th>
      <span>Journal</span>
    </th>
    <th>
      <a href="./settings.html" class="right">Réglages</a>
    </th>
  </table>

  <!--main area : change selon la page-->
  <div id="MainPage">

    <!--button to validate input into new entry-->
    <button onclick="valEntry()" id="valbutton">Validate Entry</button>

    <!--button for new text area type entry-->
    <table>
      <th>
        <button onclick="newEntry()" id="mybutton">New Entry</button>
      </th>
    </table>

    <!--Input area-->
    <table>
      <th>
        <ul id="EntryList">
          <input type="text" id="EntryInput" placeholder="Journal Entry Input...">
        </ul>
      </th>
    </table>

    <!--Old Entry type text area-->
    <textarea name="textArea" class="center" rows="5" cols="60" placeholder="Journaling Prompt..."></textarea>
  </div>
  <!------------------------------------->

  <table id="bar" class="bottombar middle">
    <tr>
      <th>
        <a href="./tracker.html" class="left">Tracker</a>
      </th>
      <th>
        <a href="./jtd_index.html" class="center">Journal</a>
      </th>
      <th>
        <a href="./todo.html" class="right">To Do</a>
      </th>
    </tr>
  </table>

  <script src="jtd_script.js"></script>
</body>
</html>
