<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Application Name</title>
  <link rel="stylesheet" href="style.css">
  <style></style>
</head>
<body>
  <!--main area : change selon la page-->
  <div id="MainPage">
    <!--test de div container pour les diary entry-->
    <table id="DiaryEntry">
      <tr>
        <th class="left">
          test
        </th>
      </tr>
    </table>

    <!--button to validate input into new entry-->
    <button onclick="valEntry()" id="valbutton">Validate Entry</button>

    <!--Input area-->
    <table>
      <th>
        <ul id="EntryList">
          <input type="text" id="EntryInput" placeholder="Journal Entry Input...">
        </ul>
      </th>
    </table>

    <!--old Entry type text area-->
    <textarea name="textArea" class="center" rows="5" cols="60" placeholder="Journaling Prompt..."></textarea>
    
    <!--button for new text area type entry-->
    <table>
      <th>
        <button onclick="newEntry()" id="mybutton">New Entry</button>
      </th>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
