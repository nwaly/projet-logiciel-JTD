<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  {% if title %}
      <title>{{title}}</title>
    {%else%}
      <title>Appli name</title>
  {%endif%}
  <link 
  rel="stylesheet"
  type="text/css"
  href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <header id="header" class="bar">
    <h1 id="today">date</h1>
    <!--Reprend le titre de la page sélectionnée-->
    {% if title %}
      <h1 id="pageTitle">{{title}}</h1>
      {%else%}
        <h1 id="pageTitle">Home</h1>
    {%endif%}
    <a href="/settings">Settings</a>
  </header>

  {% block content %}
    <!--contenu des autres pages html est importé ici-->
  {% endblock %}

  <footer id="footer" class="bar">
    <a href="/tracker">Tracker</a>
    <a href="/journal">Journal</a>
    <a href="/todo">To Do</a>
  </footer>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
