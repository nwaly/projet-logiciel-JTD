<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Journal</title>
</head>
<body>

    <h1>Journal</h1>

    <h2>Créer une nouvelle entrée</h2>
    <input id="titre" placeholder="Titre"><br><br>
    <textarea id="contenu" placeholder="Contenu"></textarea><br><br>
    <button onclick="ajouterJournal()">Créer</button>

    <hr>

    <h2>Entrées existantes</h2>
    <div id="liste-journal"></div>

    <hr>

    <h2>Modifier une entrée</h2>
    <input id="edit-id" type="hidden">
    <input id="edit-titre" placeholder="Titre" disabled><br><br>
    <textarea id="edit-contenu" placeholder="Contenu"></textarea><br><br>
    <button onclick="modifierJournal()">Enregistrer</button>

<script>
async function chargerJournal() {
    const res = await fetch("/journal");
    const data = await res.json();

    const div = document.getElementById("liste-journal");
    div.innerHTML = "";

    data.forEach(entry => {
        const bloc = document.createElement("div");
        bloc.style.border = "1px solid black";
        bloc.style.padding = "10px";
        bloc.style.margin = "5px";
        bloc.innerHTML = `
            <strong>${entry.Journal_titre}</strong><br>
            ${entry.Journal_contenu}<br>
            <button onclick="chargerPourEdition(${entry.Journal_ID}, '${entry.Journal_titre}', \`${entry.Journal_contenu}\`)">
                Modifier
            </button>
        `;
        div.appendChild(bloc);
    });
}

async function ajouterJournal() {
    const data = {
        titre: document.getElementById("titre").value,
        contenu: document.getElementById("contenu").value
    };

    await fetch("/journal", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    chargerJournal();
}

function chargerPourEdition(id, titre, contenu) {
    document.getElementById("edit-id").value = id;
    document.getElementById("edit-titre").value = titre;
    document.getElementById("edit-contenu").value = contenu;
}

async function modifierJournal() {
    const id = document.getElementById("edit-id").value;
    const contenu = document.getElementById("edit-contenu").value;

    const data = {
        contenu: contenu,
        modification: new Date().toISOString().slice(0, 19).replace("T", " ")
    };

    await fetch(`/journal/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    chargerJournal();
}

chargerJournal();
</script>

</body>
</html>
